services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: gastos
      POSTGRES_PASSWORD: gastos
      POSTGRES_DB: gastos
    ports:
      # 5433 en el equipo para no chocar con un PostgreSQL local en 5432
      - '5433:5432'
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gastos -d gastos']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  datos_postgres:
