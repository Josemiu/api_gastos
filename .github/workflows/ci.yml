name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gastos
          POSTGRES_PASSWORD: gastos
          POSTGRES_DB: gastos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gastos -d gastos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://gastos:gastos@localhost:5432/gastos

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npx prettier --check .

      # Incluye las pruebas contra PostgreSQL, porque TEST_DATABASE_URL está definida.
      - name: Tests
        run: npm test
